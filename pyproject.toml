[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confluence"
version = "2.0.0"
description = "Confluence v2: fly mushroom-body connectome controller over a mechanistic cancer microenvironment (computational research)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kelechi Ogbonna" }]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
torch = ["torch>=2.0"]
flybody = [
    "mujoco>=3.1",
    "dm_control",
    "h5py",
    "mediapy",
    "pillow",
]
stats = ["lifelines>=0.27", "pandas>=1.5"]

[project.scripts]
confluence = "confluence.__main__:main"

[tool.setuptools.packages.find]
include = ["confluence*"]

[tool.setuptools.package-data]
confluence = [
    "pharmacology/*.json",
    "telemetry/static/*",
    "connectome/data/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: optional long / 166700-neuron jobs (CONFLUENCE_FULL_BRAIN=1)",
]
